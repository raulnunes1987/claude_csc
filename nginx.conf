# ============================================================
# Ceará SC Dashboard — Configuração Nginx
# Substitua "ceara.seudominio.com.br" pelo seu domínio real.
#
# Instalação no VPS:
#   sudo cp nginx.conf /etc/nginx/sites-available/ceara
#   sudo ln -s /etc/nginx/sites-available/ceara /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ceara.seudominio.com.br
# ============================================================

# Redireciona HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ceara.seudominio.com.br;
    return 301 https://$host$request_uri;
}

# Servidor principal HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ceara.seudominio.com.br;

    # Certificado TLS gerenciado pelo certbot / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/ceara.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceara.seudominio.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Raiz do projeto (resultado de: rsync -av ./ user@VPS:/var/www/ceara/)
    root  /var/www/ceara;
    index index.html;

    # --- Cache por tipo de arquivo ---

    # HTML: 1 hora (mudanças de estrutura propagam rápido)
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # JS e CSS: 1 semana (mudam raramente)
    location ~* \.(js|css|svg)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # JSON de dados: 1 hora (resultados de jogos atualizam com frequência)
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # --- Compressão Gzip ---
    # Reduz ~70% do tamanho dos arquivos de texto.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/html
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # --- Headers de segurança ---
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- Roteamento padrão ---
    location / {
        try_files $uri $uri/ =404;
    }
}
